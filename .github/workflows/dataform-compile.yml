name: Dataform compile

# Compile every clients/*/dataform/ project so a broken model — a bad ${ref()}, a
# config typo, a renamed table — fails HERE, before dataform-sync.sh publishes it to
# the client's dataform/<slug> branch and GCP starts running it.
#
# Compilation is OFFLINE: it resolves the refs and checks the config/SQL templating
# WITHOUT touching BigQuery, so it needs no credentials and stays green whether or
# not the client's data has landed yet (declared raw tables aren't checked for
# existence at compile time). That's why this job has no secrets.

on:
  pull_request:
    paths: ["clients/*/dataform/**"]
  push:
    branches: [main]
    paths: ["clients/*/dataform/**"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Compile EVERY client's project, each with the core version it declares, so CI
      # can't go green on a version the portal won't actually run. All of them, not
      # just the changed one: an includes/ or convention change can break a sibling.
      - name: Compile
        run: |
          set -e
          for d in clients/*/dataform; do
            [ -f "$d/workflow_settings.yaml" ] || continue
            VER=$(grep -E '^dataformCoreVersion:' "$d/workflow_settings.yaml" | awk '{print $2}')
            echo "=== $d (@dataform/cli@$VER)"
            (cd "$d" && npx -y @dataform/cli@"$VER" compile)
          done
