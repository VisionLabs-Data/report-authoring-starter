# Dataform Core settings for ONE client's data pipeline.
#
# This `dataform/` folder is a copy-me TEMPLATE for a client's own Dataform repo — it is
# NOT run from the reports repo. See dataform/README.md for how to stand it up in GCP.
# The conventions here (one dataset per client, raw_/staging_/main_ layers) are explained in
# the `dataform-pipeline` skill.

# Your agency's GCP project — the same project every client's dataset lives in.
defaultProject: your-agency-gcp-project

# The client's dataset. This is the client's `dataset_slug` from the portal, set once when the
# client is created and never changed. All three layers live in it, told apart by table prefix.
defaultDataset: example_client

# Assertions live WITH the data, not in a side dataset — so a failed uniqueness check is easy
# to find next to the table it guards.
defaultAssertionDataset: example_client

# Match your BigQuery datasets' location (US, EU, us-east4, …). A mismatch fails at run time.
defaultLocation: US

dataformCoreVersion: 3.0.37
