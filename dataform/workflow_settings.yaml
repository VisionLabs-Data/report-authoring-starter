# Dataform Core settings for ONE client's data pipeline.
#
# This `dataform/` folder is a copy-me TEMPLATE for a client's own Dataform repo — it is NOT run
# from the reports repo. See dataform/README.md for how to stand it up in GCP. The modelling
# conventions (the raw → staging → main layers) are explained in the `dataform-pipeline` skill.

# Your agency's GCP project — the same project the client's datasets live in.
defaultProject: your-agency-gcp-project

# Layer = DATASET here (raw / staging / main), the idiomatic Dataform layout and the one the
# reference client uses. `main` is the default because reports read the reporting layer; staging
# models set `schema: "staging"` and the raw sources are declared in `schema: "raw"`. (Some older
# clients instead use ONE dataset with raw_/staging_/main_ table PREFIXES — if that's yours, point
# defaultDataset at the client's dataset_slug and drop the per-model `schema:` overrides.)
defaultDataset: main

# Assertions land in their own dataset so a failed check is easy to find and easy to grant on.
defaultAssertionDataset: dataform_assertions

# Match your BigQuery datasets' location (US, EU, us-east4, …). A mismatch fails at run time.
defaultLocation: US

dataformCoreVersion: 3.0.37
